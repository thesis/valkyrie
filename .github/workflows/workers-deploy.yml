# Cloudflare Workers Production Deployment
#
# This workflow:
# 1. Triggers on merge to main
# 2. Detects which workers have changes
# 3. Deploys to all configured environments using matrix builds
# 4. Records deployments in the dashboard

name: Workers Deploy

on:
  push:
    branches:
      - main
    paths:
      - "workers/**"
      - ".github/workflows/workers-*.yml"

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to deploy (leave empty for all changed)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - production
          - staging
          - all
        default: all
      force:
        description: "Force deploy even without changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: workers-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "18"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_workers: ${{ steps.detect.outputs.changed_workers }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed workers
        id: detect
        run: |
          # For manual runs with force, detect all workers
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force deploy - detecting all workers"
            BASE_REF="HEAD~1"
          else
            BASE_REF="HEAD~1"
          fi

          OUTPUT=$(npx tsx workers/_scripts/detect-changes.ts "$BASE_REF")
          echo "Detection output:"
          echo "$OUTPUT"

          HAS_CHANGES=$(echo "$OUTPUT" | jq -r '.hasChanges')
          CHANGED_WORKERS=$(echo "$OUTPUT" | jq -c '.changedWorkers')

          # Override with manual input if provided
          if [ -n "${{ github.event.inputs.worker }}" ]; then
            CHANGED_WORKERS='["${{ github.event.inputs.worker }}"]'
            HAS_CHANGES="true"
          fi

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "changed_workers=$CHANGED_WORKERS" >> $GITHUB_OUTPUT

      - name: Generate deployment matrix
        id: matrix
        run: |
          WORKERS='${{ steps.detect.outputs.changed_workers }}'
          ENV_INPUT='${{ github.event.inputs.environment }}'

          # Determine environments to deploy to
          if [ "$ENV_INPUT" = "production" ]; then
            ENVIRONMENTS='["production"]'
          elif [ "$ENV_INPUT" = "staging" ]; then
            ENVIRONMENTS='["staging"]'
          else
            ENVIRONMENTS='["production", "staging"]'
          fi

          # Build the matrix
          MATRIX=$(cat <<EOF
          {
            "include": []
          }
          EOF
          )

          for WORKER in $(echo "$WORKERS" | jq -r '.[]'); do
            for ENV in $(echo "$ENVIRONMENTS" | jq -r '.[]'); do
              # Get worker path from config
              WORKER_PATH="workers/${WORKER}"

              MATRIX=$(echo "$MATRIX" | jq --arg w "$WORKER" --arg e "$ENV" --arg p "$WORKER_PATH" \
                '.include += [{"worker": $w, "environment": $e, "path": $p}]')
            done
          done

          echo "Generated matrix:"
          echo "$MATRIX" | jq .

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy ${{ matrix.worker }} to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' && fromJson(needs.detect-changes.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runtime environment variables are loaded from GitHub Environment secrets
          # Add RUNTIME_ prefixed variables in your GitHub Environment settings
        run: |
          echo "Deploying ${{ matrix.worker }} to ${{ matrix.environment }}"

          OUTPUT=$(npx tsx workers/_scripts/deploy-worker.ts \
            ${{ matrix.worker }} \
            ${{ matrix.environment }} \
            --commit ${{ github.sha }} \
            --branch ${{ github.ref_name }})

          echo "Deploy output:"
          echo "$OUTPUT"

          SUCCESS=$(echo "$OUTPUT" | jq -r '.success')
          URL=$(echo "$OUTPUT" | jq -r '.url // empty')
          DEPLOYMENT_ID=$(echo "$OUTPUT" | jq -r '.deploymentId // empty')

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" != "true" ]; then
            ERROR=$(echo "$OUTPUT" | jq -r '.error // "Unknown error"')
            echo "::error::Deployment failed: $ERROR"
            exit 1
          fi

          echo "::notice::Deployed to $URL"

      - name: Record deployment
        if: success()
        env:
          DASHBOARD_URL: ${{ vars.DEPLOY_DASHBOARD_URL }}
          DASHBOARD_API_KEY: ${{ secrets.DEPLOY_DASHBOARD_API_KEY }}
        run: |
          if [ -n "$DASHBOARD_URL" ] && [ -n "$DASHBOARD_API_KEY" ]; then
            curl -X POST "$DASHBOARD_URL/api/deployments" \
              -H "Authorization: Bearer $DASHBOARD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "worker": "${{ matrix.worker }}",
                "environment": "${{ matrix.environment }}",
                "url": "${{ steps.deploy.outputs.url }}",
                "deploymentId": "${{ steps.deploy.outputs.deployment_id }}",
                "commitSha": "${{ github.sha }}",
                "branch": "${{ github.ref_name }}",
                "repository": "${{ github.repository }}",
                "deployedAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
              }' || echo "Dashboard recording failed (non-fatal)"
          else
            echo "Dashboard recording skipped (no URL/key configured)"
          fi

  # Summary job for branch protection
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: always()
    steps:
      - name: Check deployment results
        run: |
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            echo "No changes detected - nothing to deploy"
            exit 0
          fi

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "All deployments successful!"
            exit 0
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "::error::One or more deployments failed"
            exit 1
          else
            echo "Deployment was skipped or cancelled"
            exit 0
          fi

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          MATRIX='${{ needs.detect-changes.outputs.matrix }}'

          for ROW in $(echo "$MATRIX" | jq -c '.include[]'); do
            WORKER=$(echo "$ROW" | jq -r '.worker')
            ENV=$(echo "$ROW" | jq -r '.environment')

            if [ "${{ needs.deploy.result }}" = "success" ]; then
              STATUS="✅ Deployed"
            elif [ "${{ needs.deploy.result }}" = "failure" ]; then
              STATUS="❌ Failed"
            else
              STATUS="⏭️ Skipped"
            fi

            echo "| $WORKER | $ENV | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
