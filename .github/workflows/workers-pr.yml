# Cloudflare Workers PR Preview Deployment
#
# This workflow:
# 1. Detects which workers have changes
# 2. Provisions a preview subdomain for the PR
# 3. Builds and deploys affected workers
# 4. Comments on the PR with deployment URLs

name: Workers PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "workers/**"
      - ".github/workflows/workers-*.yml"

concurrency:
  group: workers-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_workers: ${{ steps.detect.outputs.changed_workers }}
      preview_matrix: ${{ steps.detect.outputs.preview_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed workers
        id: detect
        run: |
          OUTPUT=$(npx tsx workers/_scripts/detect-changes.ts ${{ github.event.pull_request.base.ref }})
          echo "Detection output:"
          echo "$OUTPUT"

          HAS_CHANGES=$(echo "$OUTPUT" | jq -r '.hasChanges')
          CHANGED_WORKERS=$(echo "$OUTPUT" | jq -c '.changedWorkers')
          PREVIEW_MATRIX=$(echo "$OUTPUT" | jq -c '.previewMatrix')

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "changed_workers=$CHANGED_WORKERS" >> $GITHUB_OUTPUT
          echo "preview_matrix=$PREVIEW_MATRIX" >> $GITHUB_OUTPUT

  provision-preview:
    name: Provision Preview
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      subdomain: ${{ steps.provision.outputs.subdomain }}
      dns_record_id: ${{ steps.provision.outputs.dns_record_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision subdomain
        id: provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx tsx workers/_scripts/provision-subdomain.ts ${{ github.event.pull_request.number }})
          echo "Provision output:"
          echo "$OUTPUT"

          SUBDOMAIN=$(echo "$OUTPUT" | jq -r '.subdomain')
          DNS_RECORD_ID=$(echo "$OUTPUT" | jq -r '.dnsRecordId')

          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "dns_record_id=$DNS_RECORD_ID" >> $GITHUB_OUTPUT

  deploy-preview:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: [detect-changes, provision-preview]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.preview_matrix) }}
    environment:
      name: preview
      url: https://${{ matrix.worker }}.${{ needs.provision-preview.outputs.subdomain }}
    outputs:
      deployment_urls: ${{ steps.collect-urls.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runtime environment variables (RUNTIME_ prefix)
          # Add your runtime variables here, they will be synced to the worker
        run: |
          OUTPUT=$(npx tsx workers/_scripts/deploy-worker.ts \
            ${{ matrix.worker }} \
            preview \
            --pr ${{ github.event.pull_request.number }} \
            --commit ${{ github.sha }} \
            --branch ${{ github.head_ref }})

          echo "Deploy output:"
          echo "$OUTPUT"

          SUCCESS=$(echo "$OUTPUT" | jq -r '.success')
          URL=$(echo "$OUTPUT" | jq -r '.url // empty')
          DEPLOYMENT_ID=$(echo "$OUTPUT" | jq -r '.deploymentId // empty')

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

          if [ "$SUCCESS" != "true" ]; then
            echo "Deployment failed!"
            exit 1
          fi

      - name: Collect deployment URL
        id: collect-urls
        run: |
          URL="https://${{ matrix.worker }}.${{ needs.provision-preview.outputs.subdomain }}"
          echo "urls={\"${{ matrix.worker }}\": \"$URL\"}" >> $GITHUB_OUTPUT

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [detect-changes, provision-preview, deploy-preview]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      pull-requests: write
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Workers Preview Deployment"

      - name: Generate deployment summary
        id: summary
        run: |
          WORKERS='${{ needs.detect-changes.outputs.changed_workers }}'
          SUBDOMAIN='${{ needs.provision-preview.outputs.subdomain }}'

          BODY="## Workers Preview Deployment

          | Worker | Preview URL | Status |
          |--------|-------------|--------|"

          for WORKER in $(echo "$WORKERS" | jq -r '.[]'); do
            URL="https://${WORKER}.${SUBDOMAIN}"
            BODY="${BODY}
          | ${WORKER} | [${URL}](${URL}) | ✅ Deployed |"
          done

          BODY="${BODY}

          ---
          📝 **Commit:** \`${{ github.sha }}\`
          🔗 **Branch:** \`${{ github.head_ref }}\`

          _Preview deployments are automatically cleaned up when the PR is closed or merged._"

          # Escape for GitHub Actions
          BODY="${BODY//'%'/'%25'}"
          BODY="${BODY//$'\n'/'%0A'}"
          BODY="${BODY//$'\r'/'%0D'}"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.summary.outputs.body }}
          edit-mode: replace
