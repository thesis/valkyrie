# Cloudflare Workers PR Cleanup
#
# This workflow:
# 1. Triggers when a PR is closed (merged or not)
# 2. Deprovisions the preview subdomain
# 3. Deletes preview workers
# 4. Updates the PR comment

name: Workers PR Cleanup

on:
  pull_request:
    types: [closed]
    paths:
      - "workers/**"
      - ".github/workflows/workers-*.yml"

env:
  NODE_VERSION: "18"

jobs:
  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deprovision subdomain
        id: deprovision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx tsx workers/_scripts/deprovision-subdomain.ts ${{ github.event.pull_request.number }})
          echo "Deprovision output:"
          echo "$OUTPUT"

          DELETED=$(echo "$OUTPUT" | jq -r '.deleted')
          WORKERS_DELETED=$(echo "$OUTPUT" | jq -r '.workersDeleted | join(", ")')

          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          echo "workers_deleted=$WORKERS_DELETED" >> $GITHUB_OUTPUT

      - name: Update PR comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Workers Preview Deployment"

      - name: Update comment with cleanup status
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            ## Workers Preview Deployment

            ⚠️ **Preview Cleaned Up**

            This PR has been ${{ github.event.pull_request.merged && 'merged' || 'closed' }} and the preview deployment has been removed.

            ${{ steps.deprovision.outputs.workers_deleted && format('Workers deleted: {0}', steps.deprovision.outputs.workers_deleted) || '' }}

            ---
            📝 **Commit:** `${{ github.sha }}`
            🔗 **Branch:** `${{ github.head_ref }}`
          edit-mode: replace
        permissions:
          pull-requests: write

  # Optional: Notify dashboard about cleanup
  notify-dashboard:
    name: Notify Dashboard
    runs-on: ubuntu-latest
    needs: cleanup-preview
    if: always()
    steps:
      - name: Record cleanup in dashboard
        env:
          DASHBOARD_URL: ${{ vars.DEPLOY_DASHBOARD_URL }}
          DASHBOARD_API_KEY: ${{ secrets.DEPLOY_DASHBOARD_API_KEY }}
        run: |
          if [ -n "$DASHBOARD_URL" ] && [ -n "$DASHBOARD_API_KEY" ]; then
            curl -X POST "$DASHBOARD_URL/api/deployments/cleanup" \
              -H "Authorization: Bearer $DASHBOARD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "prNumber": ${{ github.event.pull_request.number }},
                "repository": "${{ github.repository }}",
                "merged": ${{ github.event.pull_request.merged }},
                "cleanedAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
              }' || echo "Dashboard notification failed (non-fatal)"
          else
            echo "Dashboard notification skipped (no URL/key configured)"
          fi
